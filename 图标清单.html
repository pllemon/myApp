<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活记 · 图标清单</title>
<style>
  :root{
    --bg:#FAFAF8; --card:#FFFFFF; --ink:#2C2C2A; --ink2:#6B6A64; --line:#E8E6DF;
    --sys:#185FA5; --sys-bg:#E6F1FB; --cat:#0F6E56; --cat-bg:#E1F5EE; --idle:#888780; --idle-bg:#F1EFE8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:32px 24px 64px;font-size:14px;line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin-bottom:6px}
  .sub{color:var(--ink2);font-size:13px;margin-bottom:22px}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:24px;font-weight:600;line-height:1.2}
  .stat .l{font-size:12px;color:var(--ink2);margin-top:2px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;background:#EFEDE6;border-radius:10px;padding:3px}
  .tab{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink2)}
  .tab.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;background:var(--card);outline:none}
  input[type=search]:focus{border-color:#B5D4F4}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .card.idle{opacity:.62}
  .top{display:flex;align-items:center;gap:11px}
  .ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
  .ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ico.sys{background:var(--sys-bg);color:var(--sys)}
  .ico.cat{background:var(--cat-bg);color:var(--cat)}
  .card.idle .ico{background:var(--idle-bg);color:var(--idle)}
  .meta{flex:1;min-width:0}
  .nm{font-size:14px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;margin-left:6px;font-weight:500;vertical-align:middle}
  .badge.sys{background:var(--sys-bg);color:var(--sys)}
  .badge.cat{background:var(--cat-bg);color:var(--cat)}
  .badge.idle{background:var(--idle-bg);color:var(--idle)}
  .cnt{font-size:12px;color:var(--ink2);margin-top:1px}
  .locs{display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:9px}
  .loc{font-size:11px;color:var(--ink2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc::before{content:'·';margin-right:6px;color:#B4B2A9}
  .none{font-size:11px;color:var(--idle);font-style:italic}
  .empty{grid-column:1/-1;text-align:center;padding:48px;color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>生活记 · 图标清单</h1>
  <p class="sub">矢量字形总数与全项目使用位置。系统图标为线性单色（跟随主题），分类图标为多彩语义色。</p>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="tab on" data-f="all">全部</button>
      <button class="tab" data-f="system">系统图标</button>
      <button class="tab" data-f="category">分类图标</button>
      <button class="tab" data-f="idle">闲置未用</button>
    </div>
    <input type="search" id="q" placeholder="搜索图标名或使用位置…">
  </div>
  <div class="grid" id="grid"></div>
</div>

const svg = p => '<svg viewBox="0 0 24 24">'+p+'</svg>';
const stats = [
  [DATA.length,'字形总数'],
  [DATA.filter(x=>x.c>0).length,'在用图标'],
  [DATA.filter(x=>x.c===0).length,'闲置未用'],
  [DATA.filter(x=>x.t==='system').length,'系统图标'],
  [DATA.filter(x=>x.t==='category').length,'分类图标']
];
document.getElementById('stats').innerHTML = stats.map(s=>'<div class="stat"><div class="n">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('');
let filter='all';
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const list=DATA.filter(x=>{
    if(filter==='idle'&&x.c>0) return false;
    if(filter==='system'&&x.t!=='system') return false;
    if(filter==='category'&&x.t!=='category') return false;
    if(!q) return true;
    return x.n.toLowerCase().includes(q)||x.l.join(' ').toLowerCase().includes(q);
  });
  document.getElementById('grid').innerHTML = list.length ? list.map(x=>{
    const idle=x.c===0;
    const badge=idle?'<span class="badge idle">闲置</span>':'<span class="badge '+x.t+'">'+(x.t==='system'?'系统':'分类')+'</span>';
    const cnt=idle?'<div class="cnt">未在页面或配置中引用</div>':'<div class="cnt">使用 '+x.c+' 次 · '+x.f+' 个文件</div>';
    const locs=x.l.length?'<div class="locs">'+x.l.map(l=>'<div class="loc">'+l+'</div>').join('')+'</div>':'<div class="locs"><div class="none">— 暂无引用 —</div></div>';
    return '<div class="card'+(idle?' idle':'')+'"><div class="top"><div class="ico '+x.t+'">'+svg(x.p)+'</div><div class="meta"><div class="nm">'+x.n+badge+'</div>'+cnt+'</div></div>'+locs+'</div>';
  }).join('') : '<div class="empty">没有匹配的图标</div>';
}
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  b.classList.add('on'); filter=b.dataset.f; render();
});
document.getElementById('q').addEventListener('input',render);
render();
